name: 使用问题
description: 部署不成功、指令没有反应、报错，或者显示的数据不对
title: "[问题] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前请先看一遍 [README 的常见问题](https://github.com/Billtranscend/Priestess-QQbot#常见问题) 和 [部署页的常见问题](https://github.com/Billtranscend/Priestess-QQbot/blob/main/docs/deploy-official.md#常见问题)。

        日志和截图里常带有敏感信息。提交前请把 Token、Cookie、AppSecret、二维码、QQ 号和群号删掉或打码。
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 部署或启动失败
        - 连不上 QQ 开放平台
        - 指令没有反应
        - 指令报错或回复失败
        - 显示的数据不对
        - 图片显示异常或发送很慢
        - 按钮或菜单不对
        - 定时任务或自动通知没有执行
        - 从 NapCat 版迁移
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际看到的现象，以及你原本预期的结果
      placeholder: 例如：@机器人 发送 /zmd抽卡记录 后一直没有回复，别的指令都正常。应该先看到各类卡池的按钮。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 发送了什么指令、在群聊还是私聊、群主有没有打开「获取群内全部消息」、是每次都出现还是偶尔出现
      placeholder: |
        1. 在群里 @机器人 发送 /skl绑定 并完成扫码
        2. @机器人 发送 /zmd抽卡记录
        3. 每次都没有回复
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 出问题前后的机器人日志（journalctl -u nonebot），只贴相关的几十行就行，记得去掉敏感信息
      render: text
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: 系统与架构
      placeholder: 例如 Ubuntu 24.04，ARM64
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本
      description: 这个仓库的提交（git rev-parse --short HEAD）和 Python 版本
      placeholder: 例如 a1b2c3d，Python 3.12
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 是否改动过代码或配置
      description: 如果改过插件、依赖版本或 .env 里的配置，请说明改了什么
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已经看过 README 和部署页的常见问题
          required: true
        - label: 已经搜索过现有的 issue，没有找到相同的问题
          required: true
        - label: 内容里不包含 Token、Cookie、AppSecret、二维码、QQ 号或群号
          required: true
